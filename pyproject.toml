[project]
name = "maverick-harness"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "aramkris", email = "aramkris@live.com" }
]
requires-python = ">=3.12"
dependencies = [
    "click>=8.5.1",
    "pydantic>=2.14.4",
]

[project.scripts]
maverick-harness = "maverick_harness.cli:main"

[build-system]
requires = ["uv_build>=0.13.4,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "ruff>=0.17.6",
]
